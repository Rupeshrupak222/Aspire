<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aspire by Adyapan — Scholarship Test Registration</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar"><div class="logo">ady.</div><div><strong>Aspire by Adyapan</strong><div class="tag">Aspire. Achieve. Adyapan.</div></div></div>
<div class="wrap">
  <div class="card">
    <h1>Aspire Scholarship Test</h1>
    <p class="sub">Take the test, earn a scholarship of up to 100% on Adyapan courses, and get your certificate instantly.</p>
    <form id="regForm">
      <label>Full name *</label>
      <input id="name" required placeholder="Your full name">
      <div class="row">
        <div><label>Mobile number *</label><input id="phone" required placeholder="10-digit mobile number"></div>
        <div><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
      </div>
      <div class="row">
        <div><label>College</label><input id="college" placeholder="College name"></div>
        <div><label>City</label><input id="city" placeholder="City"></div>
      </div>
      <div class="row">
        <div><label>Graduation year</label>
          <select id="grad_year">
            <option value="">Select</option><option>2024</option><option>2025</option><option>2026</option><option>2027</option><option>2028</option>
          </select></div>
        <div><label>Domain track</label>
          <select id="track">
            <option value="">Select</option><option>AI / Data</option><option>Web Development</option><option>Cloud / DevOps</option><option>Cybersecurity</option><option>Other</option>
          </select></div>
      </div>
      <label>College / campaign code (if you have one)</label>
      <input id="campaign_code" placeholder="e.g. JNTUH-2026">
      <button id="regBtn" class="btn" type="submit">Continue to Test Instructions</button>
      <div id="regErr" class="err"></div>
      <p class="sub" style="margin-top:16px;font-size:13px">One attempt per mobile number. Your details are used only for the test and scholarship process.</p>
    </form>
  </div>
</div>
<script src="/js/config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
